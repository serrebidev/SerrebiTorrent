name: Cloud Release

# Every public release runs here. Every platform builds on GitHub runners and
# the release is published on Forgejo:
#   plan    - next version from tools/release_tools.ps1, same as build_exe.bat
#   linux   - tools/build_linux.sh with the maintained libtorrent wheel from
#             the libtorrent-wheels pre-release (what the VPS uses)
#   windows - the same build_exe.bat release, signed from the
#             WINDOWS_CODESIGN_PFX/PASSWORD secrets, handed the Linux tarball
#             through SERREBITORRENT_LINUX_TARBALL instead of SSH
#   macos   - ci.yml dispatched with release_tag, which attaches the macOS zip
#
#   gh workflow run cloud-release.yml -f dry_run=true    # build all, publish nothing
#   gh workflow run cloud-release.yml -f dry_run=false   # real release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every platform as workflow artifacts; push, tag and publish nothing
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  LIBTORRENT_WHEEL_SUMS_SHA256: 9ab335519a22bfcdf23d2b193b14e12bffb4b7c77dbce7d08870c717c862cfa6

jobs:
  plan:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Cloud releases run from main only (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Compute version
        id: plan
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if ("${{ inputs.dry_run }}" -eq "true") {
            $v = [regex]::Match((Get-Content app_version.py -Raw), 'APP_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          } else {
            $lines = powershell -NoProfile -File tools\release_tools.ps1 -NotesPath (Join-Path $env:RUNNER_TEMP notes.txt)
            $v = ($lines | Where-Object { $_ -like "NEXT_VERSION=*" }) -replace '^NEXT_VERSION=', ''
            if (git ls-remote --tags origin "refs/tags/v$v") { throw "Tag v$v already exists" }
            $all = Invoke-RestMethod -Uri "https://git.serrebiradio.com/api/v1/repos/serrebi/SerrebiTorrent/releases?draft=true&limit=50" -Headers @{ Authorization = "token $env:FORGEJO_TOKEN" }
            $drafts = @($all | Where-Object { $_.draft }).Count
            if ($drafts -ne 0) { throw "Draft releases exist; build_exe.bat deletes drafts, check them first" }
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Bad version '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "Version $v at $(git rev-parse HEAD)"

  quality-gate:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Install accessibility/runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-wxgtk4.0 \
            python3-libtorrent \
            xvfb \
            libgtk-3-dev \
            libtiff-dev \
            libwebp-dev

      - name: Create isolated test environment
        run: |
          python3 -m venv --system-site-packages .venv
          grep -v -E '^(wxPython)$' requirements.txt > /tmp/requirements-linux.txt
          .venv/bin/python -m pip install --disable-pip-version-check \
            -r /tmp/requirements-linux.txt pytest hypothesis

      - name: Validate Web and translation assets
        run: |
          node --check web_static/i18n.js
          node --check web_static/app.js
          .venv/bin/python tools/translation_tool.py check

      - name: Run accessibility and localized runtime regression suite
        run: |
          xvfb-run -a .venv/bin/python -m pytest -q \
            tests/test_accessible_virtual_list.py \
            tests/test_connection_dialog.py \
            tests/test_localized_entrypoint.py \
            tests/test_preferences_dialog.py \
            tests/test_add_torrent_dialog.py \
            tests/test_torrent_list.py \
            tests/test_list_accessibility.py \
            tests/test_web_i18n.py \
            tests/test_web_ui_a11y.py \
            tests/test_runtime_actions_i18n.py \
            tests/test_runtime_components_i18n.py \
            tests/test_runtime_messages_i18n.py \
            tests/test_runtime_update_i18n.py \
            tests/test_translation_center.py

  linux:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: astral-sh/setup-uv@main

      # wxPython is built from source like on the VPS; cache uv's wheel cache.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-linux-${{ hashFiles('requirements*.txt') }}
          restore-keys: uv-linux-

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libgtk-3-dev libtiff-dev libwebp-dev

      - name: Download and verify the maintained libtorrent wheel
        run: |
          gh release download libtorrent-wheels --repo "$GITHUB_REPOSITORY" --pattern '*manylinux*x86_64.whl' --dir "$RUNNER_TEMP/wheels"
          gh release download libtorrent-wheels --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS.txt' --dir "$RUNNER_TEMP/wheels"
          cd "$RUNNER_TEMP/wheels"
          actual_sums_sha="$(sha256sum SHA256SUMS.txt | awk '{print $1}')"
          [ "$actual_sums_sha" = "$LIBTORRENT_WHEEL_SUMS_SHA256" ] || {
            echo "::error::libtorrent SHA256SUMS.txt changed; review and update the pinned digest before releasing."
            exit 1
          }
          wheel_count="$(find . -maxdepth 1 -type f -name '*manylinux*x86_64.whl' | wc -l)"
          [ "$wheel_count" -eq 1 ] || {
            echo "::error::Expected exactly one Linux libtorrent wheel, found $wheel_count"
            exit 1
          }
          sha256sum --check --ignore-missing SHA256SUMS.txt

      - name: Build
        env:
          LIBTORRENT_WHEEL_DIR: ${{ runner.temp }}/wheels
          SERREBITORRENT_BUILD_VERSION: ${{ needs.plan.outputs.version }}
        run: UV="$(command -v uv)" bash tools/build_linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: SerrebiTorrent-linux
          path: dist/SerrebiTorrent-v*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    needs: [plan, linux, quality-gate]
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require the planned commit
        run: |
          if ((git rev-parse HEAD) -ne "${{ needs.plan.outputs.sha }}") { throw "main moved since the plan job; re-run the workflow" }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v8
        with:
          name: SerrebiTorrent-linux
          path: ${{ runner.temp }}/linux

      - name: Prepare wheel, Linux package, certificate and signtool
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $wheels = Join-Path $env:RUNNER_TEMP "wheels"
          gh release download libtorrent-wheels --repo $env:GITHUB_REPOSITORY --pattern '*win_amd64.whl' --dir $wheels
          if ($LASTEXITCODE -ne 0) { throw "wheel download failed" }
          gh release download libtorrent-wheels --repo $env:GITHUB_REPOSITORY --pattern 'SHA256SUMS.txt' --dir $wheels
          if ($LASTEXITCODE -ne 0) { throw "checksum download failed" }
          $sumFile = Join-Path $wheels "SHA256SUMS.txt"
          $sumDigest = (Get-FileHash $sumFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sumDigest -ne $env:LIBTORRENT_WHEEL_SUMS_SHA256) {
            throw "libtorrent SHA256SUMS.txt changed; review and update the pinned digest before releasing"
          }
          $wheelFiles = @(Get-ChildItem $wheels -Filter '*win_amd64.whl')
          if ($wheelFiles.Count -ne 1) { throw "Expected exactly one Windows libtorrent wheel, found $($wheelFiles.Count)" }
          $sumLine = Get-Content $sumFile | Where-Object { $_ -match [regex]::Escape($wheelFiles[0].Name) } | Select-Object -First 1
          if (-not $sumLine) { throw "No SHA-256 entry for $($wheelFiles[0].Name)" }
          $parts = $sumLine -split '\s+', 2
          if ($parts.Count -ne 2 -or $parts[0] -notmatch '^[0-9a-fA-F]{64}$') { throw "Invalid SHA-256 entry for $($wheelFiles[0].Name)" }
          $expected = $parts[0].ToLowerInvariant()
          $actual = (Get-FileHash $wheelFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "libtorrent wheel SHA-256 mismatch" }
          "LIBTORRENT_WHEEL_DIR=$wheels" >> $env:GITHUB_ENV
          $tar = Get-ChildItem (Join-Path $env:RUNNER_TEMP "linux") -Filter *.tar.gz | Select-Object -First 1
          "SERREBITORRENT_LINUX_TARBALL=$($tar.FullName)" >> $env:GITHUB_ENV
          if (-not $env:PFX_BASE64) { throw "WINDOWS_CODESIGN_PFX secret is missing" }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx -Force
          "SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw "signtool.exe not found" }
          "SIGNTOOL_PATH=$($tool.FullName)" >> $env:GITHUB_ENV
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add the Forgejo remote
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:FORGEJO_TOKEN"))
          git config --local "http.https://git.serrebiradio.com/.extraheader" "Authorization: Basic $auth"
          git remote add forgejo https://git.serrebiradio.com/serrebi/SerrebiTorrent.git

      - name: Dry run
        if: ${{ inputs.dry_run }}
        shell: cmd
        run: |
          call build_exe.bat dry-run || exit /b 1
          call build_exe.bat build

      - name: Release
        if: ${{ !inputs.dry_run }}
        shell: cmd
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: call build_exe.bat release

      # ci.yml's macOS job checks the release tag out from GitHub.
      - name: Push the release commit and tag to GitHub
        if: ${{ !inputs.dry_run }}
        run: |
          $tag = git describe --tags --exact-match HEAD
          if ($LASTEXITCODE -ne 0) { throw "No release tag on HEAD" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "git push main failed" }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { throw "git push $tag failed" }

      # The updater trusts this certificate's thumbprint; never ship another.
      - name: Verify Authenticode signature
        run: |
          $sig = Get-AuthenticodeSignature dist\SerrebiTorrent\SerrebiTorrent.exe
          if ($sig.SignerCertificate.Thumbprint -ne $env:SIGN_CERT_THUMBPRINT) { throw "SerrebiTorrent.exe is not signed by the release certificate ($($sig.Status))" }
          if ("$($sig.Status)" -notin @("Valid", "UnknownError", "NotTrusted")) { throw "Signature is $($sig.Status)" }
          if ("${{ inputs.dry_run }}" -ne "true") {
            $tag = git describe --tags --exact-match HEAD
            if ($tag -ne "v${{ needs.plan.outputs.version }}") { throw "Released $tag, planned v${{ needs.plan.outputs.version }}" }
          }
          "Signed: $($sig.Status)"

      - uses: actions/upload-artifact@v7
        with:
          name: SerrebiTorrent-windows
          path: |
            dist/SerrebiTorrent-v*.zip
            dist/SerrebiTorrent-update.json
          if-no-files-found: error

  macos:
    needs: [plan, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Run ci.yml (macOS build) and wait
        run: |
          set -euo pipefail
          ref=main
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"
          else
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$ref" -f release_tag="v${{ needs.plan.outputs.version }}"
          fi

          id=""
          for attempt in {1..12}; do
            mapfile -t ids < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=workflow_dispatch&per_page=20" |
                jq -r --arg ref "$ref" --arg started "$dispatched_at" '
                  .workflow_runs[]
                  | select(.head_branch == $ref and .created_at >= $started)
                  | .id
                '
            )
            if [ "${#ids[@]}" -gt 1 ]; then
              echo "::error::Multiple ci.yml workflow_dispatch runs matched $ref after $dispatched_at; refusing to watch an ambiguous run."
              exit 1
            fi
            if [ "${#ids[@]}" -eq 1 ]; then
              id="${ids[0]}"
              break
            fi
            sleep 5
          done
          [ -n "$id" ] || { echo "::error::Could not identify the ci.yml run dispatched for $ref."; exit 1; }
          echo "ci.yml on $ref -> https://github.com/$GITHUB_REPOSITORY/actions/runs/$id"
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

      - name: Verify every platform is on the release
        if: ${{ !inputs.dry_run }}
        run: |
          v="${{ needs.plan.outputs.version }}"
          api="https://git.serrebiradio.com/api/v1/repos/serrebi/SerrebiTorrent"
          have="$(curl -sf "$api/releases/tags/v$v" | jq -r '.assets[].name')"
          missing=0
          for want in "SerrebiTorrent-v$v.zip" SerrebiTorrent-update.json "SerrebiTorrent-v$v-linux-x86_64.tar.gz" "SerrebiTorrent-v$v-macos-ARM64.zip"; do
            grep -qxF "$want" <<<"$have" || { echo "::error::Missing asset $want"; missing=1; }
          done
          [ "$missing" = 0 ]
          latest="$(curl -sf "$api/releases/latest" | jq -r .tag_name)"
          [ "$latest" = "v$v" ] || { echo "::error::/releases/latest is $latest"; exit 1; }
