name: CI

# The macos job runs on the Forgejo Mac runner; everything the release
# publishes lives on Forgejo, so this workflow only needs read access
# plus a FORGEJO_TOKEN secret for the tagged-upload step below.
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build the macOS app for and attach it to (blank = no upload)
        required: false
        type: string

jobs:
  macos:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      # The runner image's Homebrew snapshot predates python@3.15, which
      # the current libtorrent-rasterbar bottle's bindings are built for;
      # without an update the formula set and the bottle disagree.
      - name: Update Homebrew
        run: brew update

      - name: Install native runtime
        run: brew install libtorrent-rasterbar

      - name: Create isolated Python 3.15 environment
        run: |
          python="$(brew --prefix python@3.15)/bin/python3.15"
          "$python" -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            -r requirements.txt -r requirements-build.txt pytest hypothesis
          .venv/bin/python -c \
            'import libtorrent; print(libtorrent.__version__, libtorrent.__file__)'

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Build standalone macOS app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          .venv/bin/python -m PyInstaller SerrebiTorrent.spec --noconfirm
          version="$($PWD/.venv/bin/python -c 'import libtorrent; print(libtorrent.__version__)')"
          .venv/bin/python tools/audit_bundle.py dist/SerrebiTorrent.app
          .venv/bin/python tools/verify_frozen.py \
            dist/SerrebiTorrent.app/Contents/MacOS/SerrebiTorrent \
            build/frozen-self-test.json \
            --expected-libtorrent "$version"

      - name: Package macOS app
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          version="$($PWD/.venv/bin/python -c 'from app_version import APP_VERSION; print(APP_VERSION)')"
          artifact="SerrebiTorrent-v${version}-macos-${RUNNER_ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/SerrebiTorrent.app "dist/$artifact"
          echo "artifact=$artifact" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: SerrebiTorrent-macos-${{ runner.arch }}
          path: dist/SerrebiTorrent-v*-macos-*.zip
          if-no-files-found: error

      - name: Attach macOS package to Forgejo release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_HOST: git.serrebiradio.com
          FORGEJO_REPO: serrebi/SerrebiTorrent
        run: |
          api="https://$FORGEJO_HOST/api/v1/repos/$FORGEJO_REPO"
          for attempt in {1..18}; do
            release="$(curl -s -H "Authorization: token $FORGEJO_TOKEN" \
              "$api/releases/tags/$TAG")"
            id="$(echo "$release" | jq -r .id)"
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              if echo "$release" | jq --arg name "$artifact" -e \
                '[.assets[].name] | index($name) != null' >/dev/null; then
                echo "$artifact is already attached to $TAG."
                exit 0
              fi
              if curl -sS -H "Authorization: token $FORGEJO_TOKEN" \
                -F "attachment=@dist/$artifact" \
                "$api/releases/$id/assets?name=$artifact"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The tagged Forgejo release was not available for the macOS upload." >&2
          exit 1
